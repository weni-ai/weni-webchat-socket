version: "3.7"

services: 
  socket:
    image: weni-websocket
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    environment: 
      - WWC_PORT=${WWC_PORT:-8081}
      - WWC_LOG_LEVEL=debug
      - WWC_S3_ENDPOINT=${WWC_S3_ENDPOINT:-CHANGE_ME}
      - WWC_S3_REGION=${WWC_S3_REGION:-CHANGE_ME}
      - WWC_S3_BUCKET=${WWC_S3_BUCKET:-CHANGE_ME}
      - WWC_S3_ACCESS_KEY=${WWC_S3_ACCESS_KEY:-CHANGE_ME}
      - WWC_S3_SECRET_KEY=${WWC_S3_SECRET_KEY:-CHANGE_ME}
      - WWC_REDIS_QUEUE_URL=redis://redis_cont:6379/1
    ports:
      - 8081:8081
    depends_on:
      - prometheus
      - grafana
      - redis
    links:
      - redis
  telephony:
    image: weni-websocket
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: start-telephony
    environment:
      - WWC_LOG_LEVEL=${WWC_LOG_LEVEL:-debug}
      - WWC_FLOWS_URL=${WWC_FLOWS_URL:-http://host.docker.internal:8090}
      - WWC_COURIER_URL=${WWC_COURIER_URL:-http://host.docker.internal:8090}
      - WWC_JWT_PRIVATE_KEY=${WWC_JWT_PRIVATE_KEY:-}
      - WWC_DB_URI=${WWC_DB_URI:-mongodb://admin:admin@host.docker.internal:27017/}
      - WWC_DB_NAME=${WWC_DB_NAME:-weni-webchat}
      - WWC_S3_ENDPOINT=${WWC_S3_ENDPOINT:-CHANGE_ME}
      - WWC_S3_REGION=${WWC_S3_REGION:-CHANGE_ME}
      - WWC_S3_BUCKET=${WWC_S3_BUCKET:-CHANGE_ME}
      - WWC_S3_ACCESS_KEY=${WWC_S3_ACCESS_KEY:-CHANGE_ME}
      - WWC_S3_SECRET_KEY=${WWC_S3_SECRET_KEY:-CHANGE_ME}
      - WWC_REDIS_QUEUE_URL=redis://redis_cont:6379/1
      - WWC_TELEPHONY_HTTP_PORT=8081
      - WWC_TELEPHONY_AUDIOSOCKET_PORT=9095
      - WWC_TELEPHONY_ADVERTISE_HOST=${WWC_TELEPHONY_ADVERTISE_HOST:-telephony}
      - WWC_TELEPHONY_VOICE_ID=${WWC_TELEPHONY_VOICE_ID:-}
    ports:
      - 8082:8081
      - 9095:9095
    depends_on:
      - redis
    links:
      - redis
  prometheus:
    image: prom/prometheus:v2.20.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana:7.1.5
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
     - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - 3000:3000
  redis:
    image: redis:alpine
    container_name: redis_cont
    ports:
      - 6379:6379
volumes:
  prometheus_data: {}